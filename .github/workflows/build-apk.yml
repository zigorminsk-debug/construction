name: Build APK

on:
  push:
    branches: [ "arena/01a0bd60-construction", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web app (Vite)
        run: npm run build

      - name: Sync web assets to Android
        run: |
          echo "Syncing dist -> android assets"
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/
          ls -lh android/app/src/main/assets/www/
          echo "Assets synced"

      - name: Ensure Gradle wrapper
        run: |
          ls -lh android/gradle/wrapper/ || true
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle wrapper jar..."
            mkdir -p android/gradle/wrapper
            # try multiple sources
            curl -L --retry 3 -o android/gradle/wrapper/gradle-wrapper.jar https://services.gradle.org/distributions/gradle-wrapper-8.7.jar || \
            curl -L --retry 3 -o android/gradle/wrapper/gradle-wrapper.jar https://repo.maven.apache.org/maven2/org/gradle/gradle-wrapper/8.7/gradle-wrapper-8.7.jar || \
            curl -L --retry 3 -o android/gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar || \
            wget -O android/gradle/wrapper/gradle-wrapper.jar https://services.gradle.org/distributions/gradle-wrapper-8.7.jar
            ls -lh android/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x android/gradlew

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Build Release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace || echo "Release build failed, debug apk is available"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: construction-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release (on main push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Construction v1.0.${{ github.run_number }}
          body: |
            Автоматическая сборка APK
            - Конструктор мебели PRO100
            - Расчёт раскроя ДСП/Фанера/ОСП/МДФ
            - Эскизы + карты раскроя + смета
            Скачайте `app-debug.apk` и установите на Android (разрешите установку из неизвестных источников).
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print APK info
        run: |
          ls -lh android/app/build/outputs/apk/debug/ || true
          ls -lh android/app/build/outputs/apk/release/ || true
