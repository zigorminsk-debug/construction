name: Build APK

on:
  push:
    branches: [ "arena/01a0bdb1-construction", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        run: |
          echo "Checking Android SDK..."
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -lh $ANDROID_HOME 2>&1 | head -40 || ls -lh /usr/local/lib/android/sdk 2>&1 | head -40
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          if [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          # Accept licenses and install required platforms
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 | tail -20 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -30 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>&1 | head -60 || true
          echo "SDK setup done"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build app icons (selected in icons/app/app-icon.json)
        run: |
          node scripts/make-icons.js
          ls -lh public/icons/ || true
          ls -lh android/app/src/main/res/mipmap-xxxhdpi/ || true

      - name: Build web app (Vite)
        run: npm run build

      - name: Sync web assets to Android
        run: |
          echo "Syncing dist -> android assets"
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/
          ls -lh android/app/src/main/assets/www/
          echo "Assets synced"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Ensure Gradle wrapper
        run: |
          ls -lh android/gradle/wrapper/ || true
          cat android/gradle/wrapper/gradle-wrapper.properties || true
          # Try to download wrapper jar via multiple mirrors, fallback to generating via installed gradle
          if [ ! -s android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing or empty, attempting download..."
            mkdir -p android/gradle/wrapper
            curl -L --retry 3 -o android/gradle/wrapper/gradle-wrapper.jar https://services.gradle.org/distributions/gradle-wrapper-8.7.jar 2>&1 | tail -20 || true
            if [ ! -s android/gradle/wrapper/gradle-wrapper.jar ]; then
              curl -L --retry 3 -o android/gradle/wrapper/gradle-wrapper.jar https://repo.maven.apache.org/maven2/org/gradle/gradle-wrapper/8.7/gradle-wrapper-8.7.jar 2>&1 | tail -20 || true
            fi
            ls -lh android/gradle/wrapper/gradle-wrapper.jar || echo "download failed"
          fi
          if [ ! -s android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating wrapper via installed gradle..."
            gradle --version 2>&1 | head -20 || true
            (cd android && gradle wrapper --gradle-version 8.7 2>&1 | tail -20 || true)
            ls -lh android/gradle/wrapper/gradle-wrapper.jar || echo "still missing"
          fi
          chmod +x android/gradlew || true
          ls -lh android/gradlew 2>&1 | head -20 || true
          ls -lh android/gradle/wrapper/ 2>&1 | head -20 || true

      - name: Show Gradle version
        working-directory: android
        run: |
          ./gradlew --version 2>&1 | head -60 || true
          gradle --version 2>&1 | head -60 || true

      - name: Build Debug APK (подписан перманентным ключом, versionCode из run_number)
        working-directory: android
        run: |
          echo "Using gradle directly (bypass wrapper)..."
          gradle --version 2>&1 | head -20 || true
          # versionCode растёт с каждым запуском CI → обновление ставится поверх установленной версии
          gradle assembleDebug -PciVersionCode=${{ github.run_number }} --stacktrace 2>&1 | tee /tmp/gradle.log; exit ${PIPESTATUS[0]}

      - name: Dump gradle log to summary
        if: always()
        run: |
          echo "### Gradle log tail" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 200 /tmp/gradle.log 2>&1 | head -c 15000 >> $GITHUB_STEP_SUMMARY || echo "no log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Wrapper check" >> $GITHUB_STEP_SUMMARY
          ls -lh android/gradle/wrapper/ >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo "### SDK check" >> $GITHUB_STEP_SUMMARY
          ls -lh $ANDROID_HOME/platforms 2>&1 | head -20 >> $GITHUB_STEP_SUMMARY || true
          cat /tmp/gradle.log 2>&1 | tail -n 300 || true

      - name: Comment gradle log on commit (only on failure)
        if: failure()
        run: |
          # Точные ошибки компиляции (Kotlin/Java) в начало комментария
          ERRORS=$(grep -E "^e: |error: |FAILURE: Build failed" /tmp/gradle.log 2>/dev/null | head -40)
          if [ -z "$ERRORS" ]; then ERR="(ошибки компиляции не найдены в логе, смотри хвост)"; fi
          LOG_TAIL=$(tail -n 120 /tmp/gradle.log 2>&1 | head -c 60000 || echo "no log file")
          BODY=$(printf "Ошибки сборки (run %s):\n%s\n\n---\n\nGradle log tail:\n\`\`\`\n%s\n\`\`\`" "${{ github.run_id }}" "$ERRORS" "$LOG_TAIL")
          echo "$BODY" > /tmp/body.txt
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat /tmp/body.txt)" 2>&1 | head -20 || echo "comment failed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Release APK (подписан перманентным ключом из репозитория)
        working-directory: android
        run: |
          # Ключ: android/keystore/construction-release.p12 (alias construction)
          # versionCode = номер запуска CI, чтобы обновлялось поверх установленной
          # Release — основной подписанный артефакт: сбой сборки прерывает пайплайн
          gradle assembleRelease -PciVersionCode=${{ github.run_number }} --stacktrace 2>&1 | tee /tmp/gradle-release.log; exit ${PIPESTATUS[0]}
          echo "Собрано:"
          ls -lh app/build/outputs/apk/release/

      - name: Upload Gradle logs (only on failure — для разбора сбоя)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            /tmp/gradle*.log
            android/app/build/outputs/
            android/build/
          if-no-files-found: warn

      - name: Upload Release APK (signed, recommended)
        uses: actions/upload-artifact@v4
        with:
          name: construction-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Verify APK signature (перманентный ключ)
        working-directory: android
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | head -1 || true)
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          if [ -n "$APK" ] && [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" 2>&1 | tee /tmp/apksign.txt || true
            echo "### Подпись APK" >> $GITHUB_STEP_SUMMARY
            cat /tmp/apksign.txt >> $GITHUB_STEP_SUMMARY || true
            # Сравнение с эталонным отпечатком из репозитория (working-directory: android)
            if grep -q "$(tail -1 keystore/cert-sha256.txt | tr -d ' ' | sed 's/sha256 Fingerprint=//')" /tmp/apksign.txt; then
              echo "✅ Подпись совпадает с перманентным ключом из android/keystore/"
            else
              echo "⚠️ Проверьте отпечаток вручную (см. android/keystore/cert-sha256.txt)"
            fi
          else
            echo "apksigner/APK не найдены, пропускаем проверку"
          fi

      - name: Create GitHub Release (каждый push — для автообновления приложения)
        # Приложение само проверяет /releases/latest и предлагает скачать новую версию.
        # Только push (без pull_request), чтобы PR-запуски не плодили релизы.
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Construction v1.0.${{ github.run_number }} (versionCode ${{ github.run_number }}, ${GITHUB_REF_NAME})
          body: |
            Автоматическая сборка APK • versionCode ${{ github.run_number }}
            - Imaster — конструктор мебели: раскрой, эскизы, крепёж, металлическая рама
            - Подписано перманентным ключом `android/keystore/construction-release.p12` —
              установка поверх предыдущей версии (тот же сертификат)
            - Рекомендуемый файл: `construction-v1.0.${{ github.run_number }}.apk` (release)
            Установка: разрешите «Установку из неизвестных источников».
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print APK info
        run: |
          echo "versionCode: ${{ github.run_number }}  (обновление ставится поверх установленной)"
          ls -lh android/app/build/outputs/apk/debug/ || true
          ls -lh android/app/build/outputs/apk/release/ || true
          echo "--- fingerprint эталонного ключа ---"
          cat android/keystore/cert-sha256.txt || true
